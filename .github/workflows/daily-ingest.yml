name: Daily Reddit Attention Snapshot

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run daily ingestion
        run: python3 scripts/ingest_daily.py

      - name: Commit and push snapshot
        run: |
          git config user.name "moonshots-bot"
          git config user.email "actions@github.com"
          git add data/daily/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily snapshot: $(date -u +%Y-%m-%d)"
            git push
          fi
